name: iOS

on:
  pull_request:
    branches: [main, develop, dispatch/integration]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main, develop]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

# A newer push to the same branch/PR makes the in-flight run obsolete; cancel it
# rather than paying for a result nobody reads. macOS minutes bill at 10x Linux,
# so this matters more here than on the JS job.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    # A clean run is a few minutes; anything past 30 is hung, not slow.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # The .xcodeproj is generated, not committed: ios/project.yml is the
      # source of truth, so CI builds it before anything else.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # appstore-kit is not published to npm, so CI builds it from source.
      # Pinned to a commit, not a branch: a submission gate that changes under
      # you is worse than no gate. Bump APPSTORE_KIT_REF deliberately.
      - name: Build appstore-kit
        working-directory: ${{ runner.temp }}
        env:
          APPSTORE_KIT_REF: e11b6afce895f631b1a0b659d86670493e177ecd
        run: |
          set -euo pipefail
          git clone https://github.com/myhumblecoder-dev/appstore-kit.git
          cd appstore-kit
          git checkout "$APPSTORE_KIT_REF"
          npm ci
          npm run build

      # The static half: no network, no repo gates. Catches the submission
      # mechanics that are invisible until an upload rejects them — device
      # family defaulting to universal, a missing export-compliance key, an
      # icon with an alpha channel.
      - name: appstore check --static
        working-directory: ${{ github.workspace }}
        run: node "${{ runner.temp }}/appstore-kit/dist/cli.js" check --static

      # Simulator names and OS versions change with every runner image, and
      # hardcoding one is the usual cause of a green pipeline going red for no
      # code reason. Resolve whatever iPhone this image actually has.
      - name: Resolve a simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          if [ -z "$udid" ]; then echo "no available iPhone simulator"; exit 1; fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator $udid"

      # CODE_SIGNING_ALLOWED=NO: a simulator test needs no signing identity,
      # and requiring one would make CI depend on provisioning secrets.
      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project NutritionCoach.xcodeproj \
            -scheme NutritionCoach \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
