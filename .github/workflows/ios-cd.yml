name: iOS CD

# Manual by default. A TestFlight build is an outward-facing artifact with a
# build number that can never be reused, so it is not something a routine push
# to develop should spend.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'What changed in this build'
        required: false
        default: 'Automated build'

concurrency:
  group: ios-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      APPSTORE_KIT_REF: e11b6afce895f631b1a0b659d86670493e177ecd
    steps:
      - uses: actions/checkout@v4

      # Fail here, with a list, rather than 20 minutes later inside xcodebuild
      # with a signing error that blames the wrong thing.
      - name: Verify required secrets are present
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=""
          for name in CERT CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [ -z "${!name:-}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing required secrets:$missing"
            echo "See ios/RELEASING.md for how to produce each one."
            exit 1
          fi
          echo "All required secrets present."

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build appstore-kit
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          git clone https://github.com/myhumblecoder-dev/appstore-kit.git
          cd appstore-kit
          git checkout "$APPSTORE_KIT_REF"
          npm ci
          npm run build

      # The submission gate, before spending a build number on an archive that
      # App Store Connect would reject.
      - name: appstore check
        working-directory: ${{ github.workspace }}
        run: node "${{ runner.temp }}/appstore-kit/dist/cli.js" check --static

      # A dedicated keychain, deleted at the end: importing into the login
      # keychain leaves a distribution certificate on a shared runner.
      - name: Import the signing certificate
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "$CERT" | base64 --decode > /tmp/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # No timeout: the default locks the keychain mid-archive and fails as
          # errSecInternalComponent, hundreds of lines into a log.
          security set-keychain-settings build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign raises a UI prompt no one can answer on CI.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/dist.p12
          security find-identity -v -p codesigning build.keychain

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # xcodebuild -allowProvisioningUpdates looks here by convention.
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" | base64 --decode \
            > ~/".appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # CURRENT_PROJECT_VERSION comes from the run number: App Store Connect
          # rejects a build number it has already seen, and project.yml's "1"
          # works for exactly one upload.
          xcodebuild archive \
            -project NutritionCoach.xcodeproj \
            -scheme NutritionCoach \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NutritionCoach.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/".appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export the IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>S84D3BXRYL</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NutritionCoach.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/".appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/NutritionCoach.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the archive for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcarchive-${{ github.run_number }}
          path: ${{ runner.temp }}/NutritionCoach.xcarchive
          retention-days: 7

      # Runners are ephemeral, but a failed job can still leave the keychain
      # default for later steps. Explicit cleanup costs nothing.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain || true
