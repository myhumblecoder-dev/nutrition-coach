name: CD

# GitFlow: `main` is the release branch — every push to main deploys to
# Vercel production. Secrets: VERCEL_TOKEN + VERCEL_ORG_ID (org), 
# VERCEL_PROJECT_ID (repo). Deploys via the Vercel CLI, no GitHub App.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once, and never cancel one midway — a
# half-finished deploy is worse than a queued one.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # prisma generate (postinstall) reads DATABASE_URL at config-load;
      # a placeholder lets the build run. The DEPLOYED app uses the
      # DATABASE_URL set on the Vercel project.
      DATABASE_URL: postgresql://user:password@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      # No `version:` — package.json's "packageManager" key is the
      # single source of truth; giving both fails action-setup.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Same major Vercel runs in production.
          node-version: 24
          cache: pnpm
      # CD triggers on push to main independently of CI, so without this a
      # direct push — or a merge made while CI was red — would deploy
      # unverified code straight to users. Re-running the checks here makes
      # the gate part of the deploy itself rather than a convention.
      - name: Verify before deploying
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build
          pnpm run typecheck
          pnpm exec vitest run
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Sync database schema
        # The 2026-08-26 cherish.ai outage: main deployed code selecting a
        # column production's DB never got, because CD had no schema step.
        # Push the schema BEFORE deploying so code and database always move
        # together. Uses the REAL DATABASE_URL from the pulled production env,
        # not the placeholder above. A repo secret DATABASE_URL wins when set
        # (Vercel returns `[SENSITIVE]` for vars flagged sensitive).
        env:
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm install --frozen-lockfile
          set -a && source .vercel/.env.production.local && set +a
          if [ -n "$PROD_DATABASE_URL" ]; then export DATABASE_URL="$PROD_DATABASE_URL"; fi
          if [ "$DATABASE_URL" = "[SENSITIVE]" ]; then
            echo "DATABASE_URL is Sensitive in Vercel and no DATABASE_URL repo secret is set" >&2
            exit 1
          fi
          # NO --skip-generate: Prisma 7 prints help and exits 0 for it — a
          # silent no-op. --accept-data-loss: db push refuses provably-safe
          # diffs (a unique index on a new all-NULL column) without it.
          pnpm exec prisma db push --accept-data-loss
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
