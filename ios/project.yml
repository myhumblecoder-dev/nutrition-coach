name: NutritionCoach
options:
  bundleIdPrefix: dev.myhumblecoder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Must equal the version created in App Store Connect. Builds are matched
    # to a version by CFBundleShortVersionString, so a 0.1.0 build simply does
    # not appear in the list when submitting 1.0 — with no error saying why.
    MARKETING_VERSION: "1.0"
    # Local default only: CD passes github.run_number, because App Store
    # Connect rejects a build number it has already seen.
    CURRENT_PROJECT_VERSION: "1"
    # Required to archive. Without it xcodebuild stops with "Signing for
    # NutritionCoach requires a development team" — advice aimed at someone
    # sitting in front of the Signing & Capabilities editor, which is nobody on
    # a CI runner. CD's ExportOptions.plist already pins the same team for the
    # export step; the archive needs it as a build setting.
    DEVELOPMENT_TEAM: S84D3BXRYL
    # Explicit, because -allowProvisioningUpdates only fetches a profile when
    # signing is automatic. Simulator tests pass CODE_SIGNING_ALLOWED=NO and
    # are unaffected.
    CODE_SIGN_STYLE: Automatic

targets:
  NutritionCoach:
    type: application
    platform: iOS
    sources:
      - path: NutritionCoach
    settings:
      base:
        # Must match the App ID registered for Sign in with Apple: a native
        # identity token carries the Bundle ID as its audience, and the
        # backend verifies against exactly this string.
        PRODUCT_BUNDLE_IDENTIFIER: dev.myhumblecoder.nutritioncoach
        INFOPLIST_FILE: NutritionCoach/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Xcode's default is universal ("1,2"), which is never a deliberate
        # choice: it makes iPad screenshots a required upload and puts the app
        # in front of a reviewer on a device it was never opened on.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # App Attest signs against one of two Apple environments, and a
        # development attestation carries a different aaguid that the server
        # rejects unless APP_ATTEST_ALLOW_DEV is set. Split per configuration
        # rather than hardcoded in the entitlement: a Release build shipping
        # "development" could not attest against a correctly configured
        # server, and the failure would only show up in production.
        Debug:
          APP_ATTEST_ENVIRONMENT: development
          # APNs has the same two-environment split, and gets it wrong more
          # quietly: a Release build carrying "development" registers a
          # sandbox token that the production APNs endpoint rejects, so
          # notifications simply never arrive and nothing fails loudly.
          APS_ENVIRONMENT: development
        Release:
          APP_ATTEST_ENVIRONMENT: production
          APS_ENVIRONMENT: production
    entitlements:
      path: NutritionCoach/NutritionCoach.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.devicecheck.appattest-environment: $(APP_ATTEST_ENVIRONMENT)

  NutritionCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NutritionCoachTests
      # SKTestSession(configurationFileNamed:) looks inside the test bundle,
      # not the project directory — without this it fails with a bare
      # "File not found" that says nothing about where it looked.
      - path: Configuration.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.myhumblecoder.nutritioncoach.tests
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: NutritionCoach

schemes:
  NutritionCoach:
    build:
      targets:
        NutritionCoach: all
        NutritionCoachTests: [test]
    # The local StoreKit configuration, so the paywall and a purchase can be
    # exercised in the Simulator with no App Store Connect at all. Declared
    # here rather than in the .xcscheme because XcodeGen generates that file —
    # hand-editing it is wiped by the next `xcodegen generate`.
    run:
      storeKitConfiguration: Configuration.storekit
    test:
      targets:
        - NutritionCoachTests
      gatherCoverageData: true
